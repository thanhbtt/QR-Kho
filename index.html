<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>

body{
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
  padding:10px;
  margin:0;
  transition:0.2s;
}

h2{
  margin-top:5px;
}

input{
  width:90%;
  padding:14px;
  margin:6px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  margin:5px;
  font-size:16px;
  background:#0a84ff;
  color:white;
}

#reader{
  width:100%;
  border-radius:14px;
  overflow:hidden;
  position:relative;
}
#focusBox{

  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  width:85%;
  height:180px;

  border:3px solid rgba(255,255,255,.25);

  border-radius:20px;

  z-index:998;

  pointer-events:none;

  box-sizing:border-box;
}
#app{
  display:none;
  animation:pop 0.2s ease;
}

#result{
  font-size:22px;
  padding:18px;
  font-weight:bold;
  min-height:90px;
}

.ok{
  color:#00ff99;
}

.err{
  color:#ff5c5c;
}

.info{
  font-size:15px;
  opacity:0.8;
  margin-bottom:10px;
}

.scanline{
  position:absolute;
  left:0;
  width:100%;
  height:3px;
  background:red;
  box-shadow:
    0 0 10px red,
    0 0 20px red,
    0 0 40px red;
  animation:scan 2s linear infinite;
  z-index:999;
}

@keyframes scan{

  0%{
    top:0;
  }

  100%{
    top:100%;
  }
}

.card{
  background:#1b1b1b;
  padding:14px;
  border-radius:14px;
  margin-top:10px;
}
#scanPopup{

  position:fixed;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  background:#111;

  border:3px solid #00ff99;

  padding:30px;

  border-radius:20px;

  font-size:28px;

  font-weight:bold;

  z-index:9999;

  display:none;
  animation:pop 0.2s ease;
  width:85%;

  box-sizing:border-box;

  box-shadow:0 0 30px #000;
}

.popup-error{

  border-color:#ff4444;

  color:#ff4444;
}

.popup-success{

  border-color:#00ff99;

  color:#00ff99;
}
  @keyframes pop{

  from{
    transform:translate(-50%,-50%) scale(0.7);
    opacity:0;
  }

  to{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }
}
</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginBox">

<h2>🔐 Đăng nhập</h2>

<input id="username" placeholder="Mã nhân viên">

<input id="password" type="password" placeholder="Mật khẩu">

<br>

<button onclick="login()">Đăng nhập</button>

<div id="loginMsg"></div>

</div>

<!-- APP -->

<div id="app">

<h2>📦 KIỂM ĐẾM KHO</h2>

<div id="userInfo"></div>
<div class="card">

  <div id="todayCount">
    📦 Hôm nay: 0
  </div>

</div>
<button onclick="switchCamera()">🔄 Camera</button>

<button onclick="toggleFlash()">🔦 Flash</button>

<button onclick="logout()">🚪 Logout</button>
<button onclick="resetCounter()">
🧹 Reset Counter
</button>
<div id="reader">

 <div id="focusBox"></div>

</div>

<div id="result">Sẵn sàng quét</div>
<div id="scanPopup"></div>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbxkvNbCzJR0EaDCxkn-xDGcCxOkQiU8Rjq06HBLkwp5PWeiEK3FUA0X9a5xJmOQ_2StsA/exec";

let currentUser = localStorage.getItem("user");

const loginBox = document.getElementById("loginBox");
const app = document.getElementById("app");
const result = document.getElementById("result");
  const popup =
  document.getElementById("scanPopup");
  const scanLine =
  document.getElementById("scanLine");
const successAudio = new Audio(
  "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
);

const errorAudio = new Audio(
  "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);

// preload
successAudio.load();
errorAudio.load();
let qr = new Html5Qrcode("reader");

let cameras = [];
let cameraIndex = 0;

let scanning = true;

let flashOn = false;
  let totalScan =
  Number(localStorage.getItem("totalScan") || 0);
// chống quét trùng
let lastCode = "";
let lastScan = 0;

// ================= AUTO LOGIN =================
if(currentUser){

  showApp();
}
function updateCounter(){

  document.getElementById("todayCount")
  .innerHTML =
  "📦 Hôm nay: " + totalScan;
}
// ================= LOGIN =================
function login(){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  fetch(
    API
    + "?action=login"
    + "&username=" + encodeURIComponent(username)
    + "&password=" + encodeURIComponent(password)
  )

  .then(r=>r.json())

  .then(res=>{
    
    if(res.success){
      // unlock audio mobile
      successAudio.play().then(()=>{
        successAudio.pause();
        successAudio.currentTime = 0;
      }).catch(()=>{});
      
      errorAudio.play().then(()=>{
        errorAudio.pause();
        errorAudio.currentTime = 0;
      }).catch(()=>{});
      localStorage.setItem("user", res.username);

      currentUser = res.username;

      showApp();

    }else{

      document.getElementById("loginMsg")
      .innerHTML = "❌ Sai tài khoản";
    }
  });
}

// ================= SHOW APP =================
function showApp(){

  loginBox.style.display = "none";

  app.style.display = "block";

  document.getElementById("userInfo")
  .innerHTML = "👤 " + currentUser;

  initCamera();
  updateCounter();
}
// ================= resetCounter =================  
function resetCounter(){

  totalScan = 0;

  localStorage.setItem(
    "totalScan",
    0
  );

  updateCounter();

  result.innerHTML =
    "🔄 Đã reset counter";
}
// ================= LOGOUT =================
function logout(){

  localStorage.removeItem("user");

  location.reload();
}

// ================= INIT CAMERA =================
function initCamera(){

  Html5Qrcode.getCameras().then(devs => {

    cameras = devs;

    let back = devs.find(d =>
      /back|rear|environment/i.test(d.label)
    );

    cameraIndex = back
      ? devs.indexOf(back)
      : devs.length - 1;

    startCamera(cameras[cameraIndex].id);
  });
}

// ================= START CAMERA =================
async function startCamera(id){

  try{

    if(qr.isScanning){

      await qr.stop();

      await qr.clear();
    }

    await qr.start(
      id,
      {
    
        fps: 20,
    
        aspectRatio: 1.777778,
    
        qrbox: {
          width: 320,
          height: 180
        },
    
        videoConstraints: {
          facingMode: "environment",
          width: 1280,
          height: 720
        },
    
        formatsToSupport: [
    
          // QR
          Html5QrcodeSupportedFormats.QR_CODE,
    
          // BARCODE
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
    
          // thêm nếu cần
          Html5QrcodeSupportedFormats.CODE_39
        ]
    
      },
      onScan
    );

  }catch(e){

    console.log(e);

    result.innerHTML = "❌ Camera lỗi";
  }
}
function isDuplicate(code){

  const now = Date.now();

  if(code === lastCode && now - lastScan < 800){

    return true;
  }

  lastCode = code;
  lastScan = now;

  return false;
}
// ================= SCAN =================
function onScan(text){

  if(!scanning) return;

  if(isDuplicate(text)) return;

  scanning = false;
  scanLine.style.animationPlayState =
  "paused";
  
  result.innerHTML = "⏳ Đang xử lý...";

  fetch(
    API
    + "?mtn=" + encodeURIComponent(text)
    + "&user=" + encodeURIComponent(currentUser)
  )

  .then(r=>r.json())

  .then(res=>{

    if(res.success){

  successEffect();

  result.innerHTML =
  `
  <div class="ok">

  ✅ Thành công

  <br><br>

  📦 ${res.product}

  <br>

  📊 SL: ${res.qty}

  </div>
  `;

  showPopup(
    `
    ✅ QUÉT THÀNH CÔNG

    <br><br>

    📦 ${res.product}

    <br>

    📊 SL: ${res.qty}
    `,
    true
  );

}else{

  errorEffect();

  result.innerHTML =
  `
  <div class="err">

  ❌ ${res.message}

  </div>
  `;

  showPopup(
    `
    ❌ ${res.message}
    `,
    false
  );
}

    // scan lại sau 3 giây
    setTimeout(()=>{
      hidePopup();
      scanLine.style.animationPlayState =
  "running";
      scanning = true;

      result.innerHTML =
        "📷 Sẵn sàng quét";

    },3000);

  })

  .catch(err=>{

    console.log(err);

    result.innerHTML =
      "❌ Lỗi kết nối";
    scanLine.style.animationPlayState =
  "running";
    scanning = true;
  });
}

// ================= SWITCH CAMERA =================
function switchCamera(){

  if(cameras.length < 2){

    alert("Chỉ có 1 camera");

    return;
  }

  cameraIndex =
    (cameraIndex + 1) % cameras.length;

  startCamera(cameras[cameraIndex].id);
}

// ================= FLASH =================
async function toggleFlash(){

  try{

    const track =
      qr.getRunningTrack();

    if(!track){

      alert("Camera chưa sẵn sàng");

      return;
    }

    const capabilities =
      track.getCapabilities();

    if(!capabilities.torch){

      alert("Thiết bị không hỗ trợ flash");

      return;
    }

    flashOn = !flashOn;

    await track.applyConstraints({
      advanced: [
        { torch: flashOn }
      ]
    });

    result.innerHTML =
      flashOn
      ? "🔦 Flash ON"
      : "🔦 Flash OFF";

  }catch(err){

    console.log(err);

    alert("Flash không hỗ trợ");
  }
}
function showPopup(html, ok=true){

  popup.style.display = "block";

  popup.className =
    ok
    ? "popup-success"
    : "popup-error";

  // GIỮ id scanPopup
  popup.id = "scanPopup";

  popup.innerHTML = html;
}

function hidePopup(){

  popup.style.display = "none";
}

// ================= SUCCESS =================
function successEffect(){

  totalScan++;

  localStorage.setItem(
    "totalScan",
    totalScan
  );

  updateCounter();

  // rung
  if(navigator.vibrate){
    if("vibrate" in navigator){

  navigator.vibrate([200,80,200]);
}
  }

  // âm thanh
  successAudio.currentTime = 0;

 successAudio.pause();

successAudio.currentTime = 0;

const playPromise =
  successAudio.play();

if(playPromise !== undefined){

  playPromise.catch(err=>{

    console.log(err);
  });
}

  // flash xanh
  document.body.style.background = "#063";

  setTimeout(()=>{

    document.body.style.background = "#111";

  },150);
}

// ================= ERROR =================
function errorEffect(){

  if(navigator.vibrate){
    navigator.vibrate([100,80,100]);
  }

  errorAudio.currentTime = 0;

  errorAudio.pause();

errorAudio.currentTime = 0;

const playPromise =
  errorAudio.play();

if(playPromise !== undefined){

  playPromise.catch(err=>{

    console.log(err);
  });
}

  document.body.style.background = "#500";

  setTimeout(()=>{

    document.body.style.background = "#111";

  },200);
}
  
</script>

</body>
</html>
