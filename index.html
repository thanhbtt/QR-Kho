<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>

body{
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
  padding:10px;
}

input{
  width:90%;
  padding:12px;
  margin:6px;
  border-radius:8px;
  border:none;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:8px;
  margin:5px;
  font-size:16px;
}

#reader{
  width:100%;
}

#app{
  display:none;
}

#result{
  font-size:22px;
  padding:15px;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginBox">

<h2>🔐 Đăng nhập</h2>

<input id="username" placeholder="Mã nhân viên">

<input id="password" type="password" placeholder="Mật khẩu">

<br>

<button onclick="login()">Đăng nhập</button>

<div id="loginMsg"></div>

</div>

<!-- APP -->

<div id="app">

<h2>📦 KIỂM ĐẾM KHO</h2>

<div id="userInfo"></div>

<button onclick="switchCamera()">🔄 Camera</button>

<button onclick="toggleFlash()">🔦 Flash</button>

<button onclick="logout()">🚪 Logout</button>

<div id="reader"></div>

<div id="result">Sẵn sàng quét</div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbxkvNbCzJR0EaDCxkn-xDGcCxOkQiU8Rjq06HBLkwp5PWeiEK3FUA0X9a5xJmOQ_2StsA/exec";

let currentUser = localStorage.getItem("user");

const loginBox = document.getElementById("loginBox");
const app = document.getElementById("app");
const result = document.getElementById("result");

let qr = new Html5Qrcode("reader");

let cameras = [];
let cameraIndex = 0;

let scanning = true;

let flashOn = false;
// chống quét trùng
let lastCode = "";
let lastScan = 0;

// ================= AUTO LOGIN =================
if(currentUser){

  showApp();
}

// ================= LOGIN =================
function login(){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  fetch(
    API
    + "?action=login"
    + "&username=" + encodeURIComponent(username)
    + "&password=" + encodeURIComponent(password)
  )

  .then(r=>r.json())

  .then(res=>{

    if(res.success){

      localStorage.setItem("user", res.username);

      currentUser = res.username;

      showApp();

    }else{

      document.getElementById("loginMsg")
      .innerHTML = "❌ Sai tài khoản";
    }
  });
}

// ================= SHOW APP =================
function showApp(){

  loginBox.style.display = "none";

  app.style.display = "block";

  document.getElementById("userInfo")
  .innerHTML = "👤 " + currentUser;

  initCamera();
}

// ================= LOGOUT =================
function logout(){

  localStorage.removeItem("user");

  location.reload();
}

// ================= INIT CAMERA =================
function initCamera(){

  Html5Qrcode.getCameras().then(devs => {

    cameras = devs;

    let back = devs.find(d =>
      /back|rear|environment/i.test(d.label)
    );

    cameraIndex = back
      ? devs.indexOf(back)
      : devs.length - 1;

    startCamera(cameras[cameraIndex].id);
  });
}

// ================= START CAMERA =================
async function startCamera(id){

  try{

    if(qr.isScanning){

      await qr.stop();

      await qr.clear();
    }

    await qr.start(
      id,
      {
    
        fps: 20,
    
        aspectRatio: 1.777778,
    
        qrbox: {
          width: 320,
          height: 180
        },
    
        videoConstraints: {
          facingMode: "environment",
          width: 1280,
          height: 720
        },
    
        formatsToSupport: [
    
          // QR
          Html5QrcodeSupportedFormats.QR_CODE,
    
          // BARCODE
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
    
          // thêm nếu cần
          Html5QrcodeSupportedFormats.CODE_39
        ]
    
      },
      onScan
    );

  }catch(e){

    console.log(e);

    result.innerHTML = "❌ Camera lỗi";
  }
}
function isDuplicate(code){

  const now = Date.now();

  if(code === lastCode && now - lastScan < 800){

    return true;
  }

  lastCode = code;
  lastScan = now;

  return false;
}
// ================= SCAN =================
function onScan(text){

  if(!scanning) return;

  // chống quét trùng
  if(isDuplicate(text)) return;

  scanning = false;

  result.innerHTML = "⏳ Đang xử lý...";

  fetch(
    API
    + "?mtn=" + encodeURIComponent(text)
    + "&user=" + encodeURIComponent(currentUser)
  )

  .then(r=>r.json())

  .then(res=>{

    if(res.success){

      result.innerHTML =
      `
      ✅ Thành công<br><br>
      📦 ${res.product}<br>
      🔢 ${res.barcode}<br>
      📊 SL: ${res.qty}
      `;

      beep();

      vibrate();

    }else{

      result.innerHTML =
      "❌ " + res.message;
    }

    resetScan();
  });
}

// ================= RESET =================
function resetScan(){

  setTimeout(()=>{

    scanning = true;

    result.innerHTML = "📷 Sẵn sàng quét";

  },250);
}

// ================= SWITCH CAMERA =================
function switchCamera(){

  if(cameras.length < 2){

    alert("Chỉ có 1 camera");

    return;
  }

  cameraIndex =
    (cameraIndex + 1) % cameras.length;

  startCamera(cameras[cameraIndex].id);
}

// ================= FLASH =================
async function toggleFlash(){

  try{

    const track = qr.getRunningTrack?.();

    if(!track){

      alert("Chưa mở camera");

      return;
    }

    flashOn = !flashOn;

    await track.applyConstraints({
      advanced:[{ torch:flashOn }]
    });

  }catch(e){

    alert("Không hỗ trợ flash");
  }
}

// ================= BEEP =================
function beep(){

  new Audio(
    "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
  ).play();
}

// ================= VIBRATE =================
function vibrate(){

  if(navigator.vibrate){

    navigator.vibrate(120);
  }
}

</script>

</body>
</html>
